name: Validate frontmatter

on:
  push:
    branches: [main]
    paths:
      # `.md` and docs.json are listed alongside `.mdx` because the two bugs
      # validate-nav-and-redirects.mjs exists to catch (an orphan ANALYTICS.md,
      # a redirect into a dead page) both live in files the old filter ignored.
      - "**/*.mdx"
      - "**/*.md"
      - "docs.json"
      - "scripts/validate-frontmatter.mjs"
      - "scripts/validate-nav-and-redirects.mjs"
      - "scripts/check-plan-limits.mjs"
      - "scripts/check-webhooks-guide.mjs"
      - "package.json"
  pull_request:
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - "docs.json"
      - "scripts/validate-frontmatter.mjs"
      - "scripts/validate-nav-and-redirects.mjs"
      - "scripts/check-plan-limits.mjs"
      - "scripts/check-webhooks-guide.mjs"
      - "package.json"

jobs:
  validate:
    name: Frontmatter SEO check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run frontmatter validator
        run: node scripts/validate-frontmatter.mjs
      - name: Check nav, orphan pages, and redirect destinations
        run: node scripts/validate-nav-and-redirects.mjs
      - name: Check plan-limit tables match the source of truth
        run: node scripts/check-plan-limits.mjs
      - name: Check webhooks guide matches the webhook contract
        run: node scripts/check-webhooks-guide.mjs
